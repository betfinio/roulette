# Roulette
query GetRoulettePlayerBets($player: Bytes, $table: Bytes, $first: Int) {
  playerRoundBetPlaceds_collection(
    where: { player: $player, table: $table }
    orderBy: blockTimestamp
    orderDirection: desc
    first: $first
  ) {
    amount
    player
    blockTimestamp
    bet
    winAmount
    winNumber
    status
  }
}
query GetRouletteAllPlayerBets($last: Int, $table: Bytes) {
  roundBetPlaceds_collection(where: { table: $table }, orderBy: blockTimestamp, orderDirection: desc, first: $last) {
    amount
    player
    blockTimestamp
    bet
    winAmount
    winNumber
    status
  }
}
query GetTransactionHashByBet($bet: Bytes) {
  betEndeds(where: { bet: $bet }) {
    transactionHash
  }
}
# Live Roulette
query GetLiveRoulettePlayerTableBets($last: Int, $table: Bytes, $player: Bytes) {
  playerRoundBetPlaceds_collection(
    where: { table: $table, player: $player }
    orderBy: blockTimestamp
    orderDirection: desc
    first: $last
  ) {
    amount
    round
    blockTimestamp
    bet
    winAmount
    winNumber
    player
    status
  }
}
query GetLiveRouletteTableAllBets($table: Bytes, $first: Int) {
  roundBetPlaceds_collection(where: { table: $table }, orderBy: blockTimestamp, orderDirection: desc, first: $first) {
    amount
    blockTimestamp
    bet
    winAmount
    winNumber
    status
    round
  }
}
query GetLiveRouletteTableSelectedRoundBets($table: Bytes, $round: BigInt) {
  playerRoundSingleBetPlaceds_collection(
    where: { table: $table, round: $round }
    orderBy: blockTimestamp
    orderDirection: desc
  ) {
    amount
    winAmount
    player
    blockTimestamp
    bet
    chips {
      id
      bitMap
    }
  }
}
query GetLiveRouletteTableSelectedRoundPlayers($table: Bytes, $round: BigInt) {
  playerRoundBetPlaceds_collection(
    where: { table: $table, round: $round }
    orderBy: blockTimestamp
    orderDirection: desc
  ) {
    amount
    player
    blockTimestamp
    betsCount
  }
}
