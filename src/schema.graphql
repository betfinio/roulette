# Single player: player's bet history
query GetRoulettePlayerBets($player: Bytes!, $gameAddress: Bytes!, $first: Int) {
	bets(where: { player: $player, gameAddress: $gameAddress }, orderBy: blockTimestamp, orderDirection: desc, first: $first) {
		betAddress
		amount
		result
		payout
		status
		blockTimestamp
		transactionHash
		chips {
			bitmap
			amount
		}
	}
}

# Single player: all bets for a game
query GetRouletteAllPlayerBets($last: Int, $gameAddress: Bytes!) {
	bets(where: { gameAddress: $gameAddress }, orderBy: blockTimestamp, orderDirection: desc, first: $last) {
		betAddress
		player
		amount
		result
		payout
		status
		blockTimestamp
		transactionHash
	}
}

# Single player: transaction hash for a specific bet
query GetTransactionHashByBet($bet: Bytes!) {
	bets(where: { betAddress: $bet }) {
		transactionHash
	}
}

# Single player: stats per player
query GetRouletteStatsByTable($gameAddress: Bytes!) {
	hotNumbers: rouletteNumbers(where: { gameAddress: $gameAddress }, orderBy: count, orderDirection: desc, first: 3) {
		number
		count
	}
	coldNumbers: rouletteNumbers(where: { gameAddress: $gameAddress }, orderBy: count, orderDirection: asc, first: 3) {
		number
		count
	}
	rouletteStat: rouletteStats_collection(where: { gameAddress: $gameAddress }) {
		totalRolls
		oddCount
		evenCount
		zeroCount
		redCount
		blackCount
	}
}

# Live roulette: player bets for a table
query GetLiveRoulettePlayerTableBets($last: Int, $gameAddress: Bytes!, $player: Bytes!) {
	bets(where: { gameAddress: $gameAddress, player: $player }, orderBy: blockTimestamp, orderDirection: desc, first: $last) {
		betAddress
		amount
		roundId
		result
		payout
		status
		player
		blockTimestamp
		round {
			roundId
			winNumber
			status
		}
	}
}

# Live roulette: all bets for a table (one row per bet — use rounds query for round-level history)
query GetLiveRouletteTableAllBets($gameAddress: Bytes!, $first: Int) {
	bets(where: { gameAddress: $gameAddress }, orderBy: blockTimestamp, orderDirection: desc, first: $first) {
		betAddress
		player
		amount
		result
		payout
		status
		roundId
		blockTimestamp
		round {
			winNumber
			status
		}
	}
}

# Live roulette: one row per round (table history / wheel / cache — not per-bet)
query GetLiveRouletteTableRounds($gameAddress: Bytes!, $first: Int) {
	rounds(where: { gameAddress: $gameAddress }, orderBy: roundId, orderDirection: desc, first: $first) {
		roundId
		status
		winNumber
		totalBetAmount
		totalPayout
		started
		blockTimestamp
	}
}

# Live roulette: bets in a specific round (with chips for visualization)
query GetLiveRouletteTableSelectedRoundBets($gameAddress: Bytes!, $roundId: BigInt!) {
	bets(where: { gameAddress: $gameAddress, roundId: $roundId }, orderBy: blockTimestamp, orderDirection: desc) {
		betAddress
		player
		amount
		payout
		chips {
			bitmap
			amount
		}
		blockTimestamp
	}
}

# Live roulette: players in a round (for players panel)
query GetLiveRouletteTableSelectedRoundPlayers($gameAddress: Bytes!, $roundId: BigInt!) {
	bets(where: { gameAddress: $gameAddress, roundId: $roundId }, orderBy: blockTimestamp, orderDirection: desc) {
		player
		amount
		chips {
			bitmap
		}
		blockTimestamp
	}
}

# Live roulette: all chip bitmaps in a round (for roulette table overlay)
query GetLiveRouletteBitMapByRound($gameAddress: Bytes!, $roundId: BigInt!) {
	bets(where: { gameAddress: $gameAddress, roundId: $roundId }) {
		player
		chips {
			bitmap
			amount
		}
	}
}

# Live roulette: round details (win number, status, total bank)
query GetLiveRouletteRoundWinNumber($gameAddress: Bytes!, $roundId: BigInt!) {
	rounds(where: { gameAddress: $gameAddress, roundId: $roundId }) {
		winNumber
		status
		totalBetAmount
	}
}

# Live roulette: bet rows for a round (status/result when rounds entity lags)
query GetLiveRouletteRoundBetsStatusSample($gameAddress: Bytes!, $roundId: BigInt!) {
	bets(where: { gameAddress: $gameAddress, roundId: $roundId }, orderBy: blockTimestamp, orderDirection: desc, first: 30) {
		status
		result
	}
}

# Live roulette: stats for a table
query GetLiveRouletteStatsByTable($gameAddress: Bytes!) {
	hotNumbers: rouletteNumbers(where: { gameAddress: $gameAddress }, orderBy: count, orderDirection: desc, first: 3) {
		number
		count
	}
	coldNumbers: rouletteNumbers(where: { gameAddress: $gameAddress }, orderBy: count, orderDirection: asc, first: 3) {
		number
		count
	}
	rouletteStat: rouletteNumbers(where: { gameAddress: $gameAddress }) {
		number
		count
	}
}
